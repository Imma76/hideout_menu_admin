<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hideout — Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <img class="logo" src="assets/logo.webp" alt="The Hideout" />
      <p class="tagline">Admin — manage categories and menu items</p>
      <button type="button" id="logout-btn" class="secondary logout-btn" hidden>
        Log out
      </button>
    </header>

    <p class="loading-text" id="loading-text">Loading…</p>

    <main class="login-root" id="login-root" hidden>
      <form id="login-form" class="inline-form login-form">
        <h2>Admin Login</h2>
        <input
          type="text"
          id="login-username"
          placeholder="Username"
          autocomplete="username"
          required
        />
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Log in</button>
        <p class="msg" id="login-msg"></p>
      </form>
    </main>

    <main class="admin-root" id="admin-root" hidden>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="categories">Categories</button>
        <button class="tab-btn" data-tab="items">Menu Items</button>
        <!-- QR Code tab temporarily disabled — see commented section below to re-enable.
      <button class="tab-btn" data-tab="qrcode">QR Code</button>
      --></nav>

      <section id="tab-categories" class="tab-panel active">
        <div class="section-header">
          <h2>Categories</h2>
          <button type="button" id="category-add-btn">Add Category</button>
        </div>
        <dialog id="category-dialog" class="modal" tabindex="-1">
          <form id="category-form" class="inline-form">
            <h3 id="category-dialog-title">Add Category</h3>
            <input type="hidden" id="category-id" />
            <input
              type="text"
              id="category-name"
              placeholder="Category name"
              required
            />
            <select id="category-section" required>
              <option value="food">Food</option>
              <option value="drinks">Drinks</option>
            </select>
            <input
              type="number"
              id="category-sort"
              placeholder="Sort order"
              value="0"
            />
            <p class="msg" id="category-msg"></p>
            <div class="modal-actions">
              <button type="submit" id="category-submit">Add Category</button>
              <button type="button" id="category-cancel" class="secondary">
                Cancel
              </button>
            </div>
          </form>
        </dialog>
        <input
          type="search"
          id="category-search"
          class="search-field"
          placeholder="Search categories…"
        />
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Details</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="category-list"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-items" class="tab-panel">
        <div class="section-header">
          <h2>Menu Items</h2>
          <button type="button" id="item-add-btn">Add Item</button>
        </div>
        <dialog id="item-dialog" class="modal" tabindex="-1">
          <form id="item-form" class="inline-form item-form">
            <h3 id="item-dialog-title">Add Item</h3>
            <input type="hidden" id="item-id" />
            <input type="text" id="item-name" placeholder="Item name" required />
            <input type="text" id="item-description" placeholder="Description" />
            <input
              type="number"
              id="item-price"
              placeholder="Price"
              step="0.01"
              min="0"
              required
            />
            <select id="item-category" required></select>
            <label class="checkbox-label">
              <input type="checkbox" id="item-available" checked />
              Available
            </label>
            <p class="msg" id="item-msg"></p>
            <div class="modal-actions">
              <button type="submit" id="item-submit">Add Item</button>
              <button type="button" id="item-cancel" class="secondary">
                Cancel
              </button>
            </div>
          </form>
        </dialog>
        <input
          type="search"
          id="item-search"
          class="search-field"
          placeholder="Search menu items…"
        />
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Details</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="item-list"></tbody>
          </table>
        </div>
      </section>

      <!-- QR Code tab temporarily disabled — uncomment this section, the nav button
         above, the qrcodejs script tag below, and the QR Code block in app.js to
         re-enable.
    <section id="tab-qrcode" class="tab-panel">
      <h2>Table QR Code</h2>
      <p class="hint">
        This QR code links straight to the public menu. Print it and place it on tables —
        guests scan it, the menu site loads, and it always reflects whatever you save here.
      </p>
      <form id="qr-form" class="inline-form">
        <input type="text" id="qr-url" />
        <button type="submit">Generate</button>
      </form>
      <div id="qr-output" class="qr-output"></div>
    </section>
    --></main>

    <div id="toast" class="toast" hidden></div>

    <dialog id="confirm-dialog" class="modal confirm-modal">
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel" class="secondary">
          Cancel
        </button>
        <button type="button" id="confirm-ok" class="button-danger">
          Delete
        </button>
      </div>
    </dialog>

    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> -->
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
